[General]
network = tcpstudy.SimpleTcpNetwork
sim-time-limit = 60s
result-dir = results

# --- Default bottleneck parameters ---
*.rateBottleneck = 5Mbps
*.delayBottleneck = 50ms

# --- RED queues ---
*.router.ppp[1].queue.typename = "RedDropperQueue"

*.router.ppp[1].queue.packetCapacity = 20

*.router.ppp[1].queue.red.minth = 5
*.router.ppp[1].queue.red.maxth = 15
*.router.ppp[1].queue.red.maxp = 0.1
*.router.ppp[1].queue.red.wq = 0.002
*.router.ppp[1].queue.red.packetCapacity = 20

# --- Client application ---
*.client.numApps = 1
*.client.app[0].typename = "TcpSessionApp"
*.client.app[0].connectAddress = "server"
*.client.app[0].connectPort = 80
*.client.app[0].tOpen = 0s
*.client.app[0].tSend = 0s
*.client.app[0].sendBytes = 50MiB
*.client.app[0].tClose = -1s

# --- Server application ---
*.server.numApps = 1
*.server.app[0].typename = "TcpSinkApp"
*.server.app[0].localPort = 80

# --- TCP Reno ---
**.tcp.tcpAlgorithmClass = "TcpReno"

# Allow a sufficiently large receive window
**.tcp.windowScalingSupport = true
**.tcp.advertisedWindow = 2097152

# --- Result recording ---
record-eventlog = true
**.vector-recording = true
**.scalar-recording = true


############################################################
# Experiments
############################################################

[Config Bandwidth1Mbps]
extends = General
*.rateBottleneck = 1Mbps

[Config Bandwidth10Mbps]
extends = General
*.rateBottleneck = 10Mbps

[Config Delay10ms]
extends = General
*.delayBottleneck = 10ms

[Config Delay100ms]
extends = General
*.delayBottleneck = 100ms

[Config TcpNewReno]
extends = General
**.tcp.tcpAlgorithmClass = "TcpNewReno"

[Config DropTail]
extends = General

*.router.ppp[1].queue.typename = "DropTailQueue"
*.router.ppp[1].queue.packetCapacity = 20

[Config RED]
extends = General

*.router.ppp[1].queue.typename = "RedDropperQueue"
*.router.ppp[1].queue.packetCapacity = 20

*.router.ppp[1].queue.red.minth = 5
*.router.ppp[1].queue.red.maxth = 15
*.router.ppp[1].queue.red.maxp = 0.1
*.router.ppp[1].queue.red.wq = 0.002
*.router.ppp[1].queue.red.packetCapacity = 20